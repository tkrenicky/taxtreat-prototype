name: Probe EX10 API
on:
  push:
    paths:
      - "scripts/probe_api.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install remotezip
      - run: python scripts/probe_api.py
