name: Build LicenseBench 1000 POC

on:
  push:
    paths:
      - "scripts/build_licensebench.py"
      - ".github/workflows/build-licensebench.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ranged archive reader
        run: pip install remotezip
      - name: Download 1000 real SEC licence candidates and build UI
        run: python scripts/build_licensebench.py
      - name: Upload raw first-1000 corpus and structured results
        uses: actions/upload-artifact@v4
        with:
          name: licensebench-first-1000
          path: |
            artifacts/raw
            artifacts/contracts.json
            artifacts/stats.json
          retention-days: 30
      - name: Commit generated UI + structured result
        run: |
          git config user.name "licensebench-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/index.html docs/results.json
          git diff --cached --quiet && exit 0
          git commit -m "Build LicenseBench POC with first 1000 SEC contracts"
          git push
